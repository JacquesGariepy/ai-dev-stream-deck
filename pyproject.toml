[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-stream-deck"
version = "0.1.0"
description = "A local Windows control panel for installed AI harnesses and PowerShell profiles."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-dev = "aidev.__main__:main"

[tool.setuptools.package-data]
aidev = ["scripts/*.ps1"]
